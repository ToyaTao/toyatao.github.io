<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toya的知识汇总手册</title>
    <style>
        :root{
            --a:16px;
            --b:17px;
            --c:15px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            max-width: 1140px;
            margin: 50px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 35px;
        }
        /* 左侧整体容器 */
        .left-wrap{
            display:flex;
            flex-direction:column;
            gap:20px;
        }
        /* Toya艺术字 */
        .logo-text{
            text-align:center;
            font-size:26px;
            font-weight:bold;
            font-style:italic;
            letter-spacing:4px;
            color:#222222;
            text-shadow: 0.5px 0.5px 2px #cccccc;
        }
        /* 按钮区域 */
        .btn-box{
            background: #f3f3f3;
            padding:22px;
            border-radius:10px;
            box-shadow: 2px 2px 8px #d0d0d0;
        }
        .btn-box button{
            width:100%;
            padding:14px;
            margin:8px 0;
            border:none;
            background:#2468c7;
            color:#fff;
            border-radius:6px;
            font-size:var(--a);
            cursor:pointer;
        }
        .btn-box button:hover{
            background:#194b94;
        }
        /* 右侧内容区域 */
        .right-content{
            background:#f8f8f8;
            padding:30px;
            border-radius:10px;
            line-height:1.8;
            box-shadow: 2px 2px 8px #e2e2e2;
        }
        /* 标题文字：白芷、当归 */
        .text-main{
            font-size: var(--b);
        }
        /* 小字说明：正品、假 */
        .text-sub{
            font-size: var(--c);
        }
        .content-item{
            display:none;
        }
        .content-item.active{
            display:block;
        }
    </style>
</head>
<body>
    <!-- 左侧 -->
    <div class="left-wrap">
        <div class="logo-text">
            Toya
        </div>
        <div class="btn-box">
            <button onclick="switchTab('acupuncture')">针灸穴位</button>
            <button onclick="switchTab('herb')">中药判断真假</button>
            <button onclick="switchTab('survival')">求生知识</button>
            <button onclick="switchTab('trade')">外贸知识</button>
            <button onclick="switchTab('other')">其他知识</button>
        </div>
    </div>

    <!-- 右侧内容区域 -->
    <div class="right-content">
        <div class="content-item active" id="acupuncture">
            曲池，手三里。
        </div>
        <div class="content-item" id="herb">
            <strong class="text-main">白芷：</strong><br>
            <data class="text-sub">正品：切面外圈有很多棕色的油点。</data><br>
            <data class="text-sub">假：颜色惨白，一摸掉粉。</data><br><br>
            <strong class="text-main">当归：</strong><br>
            <data class="text-sub">正品：切面油性足。</data><br>
            <data class="text-sub">假：呈长条状。</data>
        </div>
        <div class="content-item" id="survival">
            1。
        </div>
        <div class="content-item" id="trade">
            2。
        </div>
        <div class="content-item" id="other">
            塑料PP5。
        </div>
    </div>

<script>
function switchTab(id){
    document.querySelectorAll('.content-item').forEach(box=>{
        box.classList.remove('active');
    })
    document.getElementById(id).classList.add('active');
}
</script>
</body>
</html>
